<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeForge: a code editor for your phone and your browser</title>
<meta name="description" content="A code editor with a real terminal, Git, live preview and AI assistants. Install the Android app or open the web editor, no account needed.">
<meta name="theme-color" content="#1f1f1f">
<meta name="color-scheme" content="dark light">
<script>
/* Light / Dark / System: applied before the first paint so the page never flashes the wrong colours */
(function(){try{var m=localStorage.getItem("cf.site.theme")||"system";var d=m==="dark"||(m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";document.documentElement.dataset.themeMode=m;}catch(e){document.documentElement.dataset.theme="dark";}})();
</script>
<link rel="icon" href="%BASE_URL%assets/logo.svg" type="image/svg+xml">
<script src="%BASE_URL%site-config.js"></script>
</head>
<body>
<div id="root"></div>
<noscript><p style="font:16px system-ui;padding:24px">CodeForge's website needs JavaScript. The <a href="app/">web editor</a> does too.</p></noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
