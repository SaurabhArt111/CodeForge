<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>CodeForge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#181818">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="vendor/codicons/codicon.css">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot">
  <svg class="boot-svg" viewBox="0 0 108 108" aria-hidden="true">
    <rect class="tile" x="4" y="4" width="100" height="100" rx="26" fill="#007acc"/>
    <path class="br l" d="M40 41L26 54L40 67" pathLength="1"/><path class="br m" d="M58 38L50 70" pathLength="1"/><path class="br r" d="M68 41L82 54L68 67" pathLength="1"/>
  </svg>
  <div class="boot-title">CodeForge</div><div class="boot-bar"><i></i></div><div id="boot-msg">Starting…</div><div id="boot-err"></div>
</div></div>

<div id="app" class="hidden">
  <header id="titlebar">
    <button id="btn-sidebar" class="tb-btn" title="Menu"><i class="codicon codicon-menu"></i></button>
    <div id="title" title="Command Palette"><i class="codicon codicon-search"></i><span id="title-text">CodeForge</span></div>
    <div class="spacer"></div>
    <button id="btn-undo" class="tb-btn" title="Undo (Ctrl+Z)"><i class="codicon codicon-discard"></i></button>
    <button id="btn-redo" class="tb-btn" title="Redo (Ctrl+Shift+Z)"><i class="codicon codicon-redo"></i></button>
    <button id="btn-run" class="tb-btn" title="Run file / Live preview"><i class="codicon codicon-play"></i></button>
    <button id="btn-split" class="tb-btn desk" title="Split editor"><i class="codicon codicon-split-horizontal"></i></button>
    <button id="btn-term" class="tb-btn" title="Terminal"><i class="codicon codicon-terminal"></i></button>
    <button id="btn-ai" class="tb-btn" title="AI Assistant"><i class="codicon codicon-sparkle"></i></button>
    <button id="btn-account" class="tb-btn desk" title="Account"><i class="codicon codicon-account"></i></button>
  </header>

  <div id="toploader"><i></i></div>
  <div id="main">
    <nav id="activitybar">
      <div class="ab-group">
        <button class="ab-btn" data-view="explorer" title="Explorer"><i class="codicon codicon-files"></i></button>
        <button class="ab-btn" data-view="search" title="Search"><i class="codicon codicon-search"></i></button>
        <button class="ab-btn" data-view="git" title="Source Control"><i class="codicon codicon-source-control"></i><span class="badge hidden" id="git-badge"></span></button>
        <button class="ab-btn" data-view="run" title="Run &amp; Preview"><i class="codicon codicon-debug-alt"></i></button>
        <button class="ab-btn" data-view="extensions" title="Extensions &amp; Plugins"><i class="codicon codicon-extensions"></i></button>
        <button class="ab-btn" data-view="ai" title="AI Assistant"><i class="codicon codicon-sparkle"></i></button>
      </div>
      <div class="ab-group bottom">
        <button class="ab-btn" id="ab-account" title="Account"><i class="codicon codicon-account"></i></button>
        <button class="ab-btn" id="ab-settings" title="Settings"><i class="codicon codicon-settings-gear"></i></button>
      </div>
    </nav>

    <aside id="sidebar">
      <section class="view" id="view-explorer"></section>
      <section class="view" id="view-search"></section>
      <section class="view" id="view-git"></section>
      <section class="view" id="view-run"></section>
      <section class="view" id="view-extensions"></section>
      <section class="view" id="view-ai"></section>
    </aside>
    <div id="sash-v" class="sash v"></div>
    <div id="side-backdrop"></div>

    <main id="workbench">
      <!-- TOP sheet: stays visible above the keyboard – handy for a terminal while you type code -->
      <section id="sheet-top" class="sheet top hidden" data-sheet="top">
        <div class="sheet-head">
          <div class="sheet-tabs"></div><div class="spacer"></div><div class="sheet-actions"></div>
          <button class="icon-btn sheet-add" title="Add a view to this sheet"><i class="codicon codicon-add"></i></button>
          <button class="icon-btn sheet-more" title="Sheet options"><i class="codicon codicon-ellipsis"></i></button>
          <button class="icon-btn sheet-max" title="Maximize"><i class="codicon codicon-screen-full"></i></button>
          <button class="icon-btn sheet-close" title="Close sheet"><i class="codicon codicon-close"></i></button>
        </div>
        <div class="sheet-body"></div>
      </section>
      <div id="sash-top" class="sash h hidden"></div>
      <div id="editor-area">
        <div class="group" id="group-0"><div class="tabs-row"><div class="tabs"></div></div><div class="group-body"></div></div>
        <div class="sash v hidden" id="sash-split"></div>
        <div class="group hidden" id="group-1"><div class="tabs-row"><div class="tabs"></div></div><div class="group-body"></div></div>
      </div>
      <div id="sash-h" class="sash h hidden"></div>
      <!-- BOTTOM sheet (id kept for older code) -->
      <section id="panel" class="sheet bottom hidden" data-sheet="bottom">
        <div class="sheet-head">
          <div class="sheet-tabs"></div><div class="spacer"></div><div class="sheet-actions"></div>
          <button class="icon-btn sheet-add" title="Add a view to this sheet"><i class="codicon codicon-add"></i></button>
          <button class="icon-btn sheet-more" title="Sheet options"><i class="codicon codicon-ellipsis"></i></button>
          <button class="icon-btn sheet-max" title="Maximize"><i class="codicon codicon-screen-full"></i></button>
          <button class="icon-btn sheet-close" title="Close sheet"><i class="codicon codicon-close"></i></button>
        </div>
        <div class="sheet-body">
          <div class="pane" id="pane-terminal"></div>
          <div class="pane" id="pane-preview"></div>
          <div class="pane" id="pane-output"></div>
          <div class="pane" id="pane-problems"></div>
        </div>
      </section>
      <!-- PAGE: a full-screen page over the editor (back button on the left) -->
      <section id="sheet-page" class="sheet page hidden" data-sheet="page">
        <div class="sheet-head">
          <div class="sheet-tabs"></div><div class="spacer"></div><div class="sheet-actions"></div>
          <button class="icon-btn sheet-add" title="Add a view to this sheet"><i class="codicon codicon-add"></i></button>
          <button class="icon-btn sheet-more" title="Sheet options"><i class="codicon codicon-ellipsis"></i></button>
          <button class="icon-btn sheet-max" title="Maximize"><i class="codicon codicon-screen-full"></i></button>
          <button class="icon-btn sheet-close" title="Close sheet"><i class="codicon codicon-close"></i></button>
        </div>
        <div class="sheet-body"></div>
      </section>
    </main>
    <!-- RIGHT sheet: opposite the aside, fixed width -->
    <section id="sheet-right" class="sheet right hidden" data-sheet="right">
        <div class="sheet-head">
          <div class="sheet-tabs"></div><div class="spacer"></div><div class="sheet-actions"></div>
          <button class="icon-btn sheet-add" title="Add a view to this sheet"><i class="codicon codicon-add"></i></button>
          <button class="icon-btn sheet-more" title="Sheet options"><i class="codicon codicon-ellipsis"></i></button>
          <button class="icon-btn sheet-max" title="Maximize"><i class="codicon codicon-screen-full"></i></button>
          <button class="icon-btn sheet-close" title="Close sheet"><i class="codicon codicon-close"></i></button>
        </div>
      <div class="sheet-body"></div>
    </section>
    <div id="right-backdrop"></div>
  </div>

  <footer id="statusbar">
    <div class="sb-left" id="sb-left"></div>
    <div class="sb-right" id="sb-right"></div>
  </footer>

  <div id="keybar" class="hidden"><div id="keybar-row"></div></div>
  <nav id="bottomnav">
    <button data-nav="explorer"><i class="codicon codicon-files"></i><span>Files</span></button>
    <button data-nav="search"><i class="codicon codicon-search"></i><span>Search</span></button>
    <button data-nav="editor"><i class="codicon codicon-edit"></i><span>Editor</span></button>
    <button data-nav="terminal"><i class="codicon codicon-terminal"></i><span>Terminal</span></button>
    <button data-nav="more"><i class="codicon codicon-ellipsis"></i><span>More</span></button>
  </nav>

</div>

<div id="overlay"></div>
<div id="toasts"></div>

<script src="vendor/monaco/vs/loader.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
