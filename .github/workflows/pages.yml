# ONE-TIME SETUP: repository Settings → Pages → Build and deployment → Source: “GitHub Actions”. Without it the deploy job fails with
# “Failed to create deployment (status: 404) … Ensure GitHub Pages has been enabled”.
# Publishes the website (React site, /app web editor, /code browser, /download) to GitHub Pages on every push to main.
# GitHub Pages is static, so the Git CORS proxy is not available there: set "proxy" in website/public/site-config.js to a deployed `npm start` server if you want cloning in the web editor.
name: Website
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json }
      - name: Build site
        working-directory: website
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        # `sh` / `node` are used on purpose: files edited on Windows lose their executable bit in Git
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: website/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
