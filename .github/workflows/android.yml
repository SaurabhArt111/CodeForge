name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # The ubuntu runner image already ships the Android SDK + cmdline-tools, so we do NOT use
      # android-actions/setup-android (its default `tools` package no longer exists and made sdkmanager fail).
      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        # `sh` instead of executing the file: gradlew committed from Windows has no executable bit (exit 126 "Permission denied")
        run: sh ./gradlew --no-daemon assembleDebug
        env:
          CODEFORGE_GITHUB_CLIENT_ID: ${{ secrets.CODEFORGE_GITHUB_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: CodeForge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
  web:
    # Static web version (PWA) built from the same UI; no Android SDK needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/web/build.sh web-dist
      - uses: actions/upload-artifact@v4
        with:
          name: CodeForge-web
          path: web-dist
