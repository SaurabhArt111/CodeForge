# Netlify: build the whole site (React + web editor); no server needed.
[build]
  base = "website"
  command = "npm ci && npm run build"
  publish = "website/dist"
[build.environment]
  NODE_VERSION = "20"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
